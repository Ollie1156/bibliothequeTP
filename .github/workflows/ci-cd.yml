# Pipeline CI/CD
#  - push sur develop (et Pull Requests)  -> TESTS : build des images + tests de bout en bout avec Docker Compose
#  - tag vX.Y.Z posé sur main             -> PRODUCTION : tests, build, push vers GHCR, déploiement Kubernetes
name: CI/CD

on:
  push:
    branches: [develop]
    tags: ["v*"]
  pull_request:
    branches: [develop, main]

permissions:
  contents: read
  packages: write   # nécessaire pour pousser les images sur GitHub Container Registry

env:
  REGISTRY: ghcr.io

jobs:
  # ------------------------------------------------------------------
  # 1. Tests : on construit toutes les images et on lance l'appli
  #    complète avec Docker Compose, puis on teste le parcours utilisateur.
  # ------------------------------------------------------------------
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Créer un .env de test (valeurs aléatoires, jamais versionnées)
        run: |
          {
            echo "DB_NAME=bibliotheque"
            echo "DB_USER=ci_user"
            echo "DB_PASSWORD=$(openssl rand -hex 16)"
            echo "JWT_SECRET=$(openssl rand -hex 32)"
          } > .env

      - name: Build et démarrage (attend que tous les healthchecks soient OK)
        run: docker compose up -d --build --wait --wait-timeout 180

      - name: Test de bout en bout via le front (reverse proxy)
        run: |
          set -e
          BASE=http://localhost:3000
          curl -fsS $BASE/health
          curl -fsS -X POST $BASE/api/auth/users/signup \
            -H "Content-Type: application/json" \
            -d '{"username":"ci_test","password":"motdepasse"}'
          TOKEN=$(curl -fsS -X POST $BASE/api/auth/users/login \
            -H "Content-Type: application/json" \
            -d '{"username":"ci_test","password":"motdepasse"}' | jq -r .access_token)
          curl -fsS -X POST $BASE/api/books/books \
            -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" \
            -d '{"title":"Dune","author":"Frank Herbert"}'
          curl -fsS $BASE/api/books/books -H "Authorization: Bearer $TOKEN" | jq -e 'length == 1'
          # Sans jeton, l'accès doit être refusé
          CODE=$(curl -s -o /dev/null -w '%{http_code}' $BASE/api/books/books)
          echo "Sans jeton -> HTTP $CODE"
          [ "$CODE" = "401" ] || [ "$CODE" = "403" ]

      - name: Logs en cas d'échec
        if: failure()
        run: docker compose logs

      - name: Nettoyage
        if: always()
        run: docker compose down -v

  # ------------------------------------------------------------------
  # 2. Build + Push : uniquement pour un tag de version posé sur main
  # ------------------------------------------------------------------
  build-and-push:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [auth, books, front]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # historique complet pour vérifier la branche du tag

      - name: Vérifier que le tag est bien sur main
        run: |
          git fetch origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main \
            || { echo "Le tag doit pointer sur un commit de main"; exit 1; }

      - name: Nom du propriétaire en minuscules (exigé par GHCR)
        run: echo "OWNER=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      - name: Connexion à GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}   # jeton fourni automatiquement par GitHub

      - name: Build et push de l'image ${{ matrix.service }}
        uses: docker/build-push-action@v6
        with:
          context: services/${{ matrix.service }}
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.OWNER }}/bibliotheque-${{ matrix.service }}:${{ github.ref_name }}
            ${{ env.REGISTRY }}/${{ env.OWNER }}/bibliotheque-${{ matrix.service }}:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  # ------------------------------------------------------------------
  # 3. Déploiement Kubernetes (kubectl apply)
  #    Le cluster Docker Desktop est sur le PC et n'est pas joignable depuis
  #    GitHub : on déploie donc dans un cluster Kubernetes éphémère (kind)
  #    créé dans le runner. Pour un vrai cluster distant, on remplacerait
  #    l'étape "kind" par un kubeconfig stocké dans les secrets GitHub.
  # ------------------------------------------------------------------
  deploy:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-and-push
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4

      - name: Nom du propriétaire en minuscules
        run: echo "OWNER=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"

      - name: Créer le cluster Kubernetes
        uses: helm/kind-action@v1
        with:
          cluster_name: bibliotheque

      - name: Connexion à GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Récupérer les images publiées et les charger dans le cluster
        run: |
          for svc in auth books front; do
            IMG=$REGISTRY/$OWNER/bibliotheque-$svc:$VERSION
            docker pull "$IMG"
            kind load docker-image "$IMG" --name bibliotheque
          done

      - name: Créer le Secret Kubernetes (depuis les secrets GitHub, jamais depuis Git)
        env:
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
        run: |
          kubectl apply -f deploy/namespace.yaml
          kubectl create secret generic bibliotheque-secrets -n bibliotheque \
            --from-literal=DB_USER=biblio_user \
            --from-literal=DB_PASSWORD="${DB_PASSWORD:-$(openssl rand -hex 16)}" \
            --from-literal=JWT_SECRET="${JWT_SECRET:-$(openssl rand -hex 32)}" \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Fixer la version des images dans kustomization.yaml
        run: |
          for svc in auth books front; do
            yq -i "(.images[] | select(.name | test(\"bibliotheque-$svc$\"))) |= (.newName = \"$REGISTRY/$OWNER/bibliotheque-$svc\" | .newTag = \"$VERSION\")" deploy/kustomization.yaml
          done
          cat deploy/kustomization.yaml

      - name: Déploiement
        run: kubectl apply -k deploy/

      - name: Attendre que les déploiements soient prêts
        run: |
          for d in postgres auth books front; do
            kubectl rollout status deployment/$d -n bibliotheque --timeout=180s
          done
          kubectl get all -n bibliotheque

      - name: Test de fumée sur le cluster
        run: |
          kubectl port-forward -n bibliotheque svc/front 8080:80 &
          sleep 5
          curl -fsS http://localhost:8080/health
          curl -fsS -X POST http://localhost:8080/api/auth/users/signup \
            -H "Content-Type: application/json" \
            -d '{"username":"deploy_test","password":"motdepasse"}'

      - name: Diagnostic en cas d'échec
        if: failure()
        run: |
          kubectl get pods -n bibliotheque -o wide
          kubectl describe pods -n bibliotheque
          kubectl logs -n bibliotheque -l 'app in (auth,books,front,postgres)' --tail=50
