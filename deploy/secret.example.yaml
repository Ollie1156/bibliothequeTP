# MODÈLE de Secret. Les vraies valeurs ne sont jamais versionnées.
#
# Méthode recommandée (rien n'est écrit dans un fichier) :
#   kubectl create secret generic bibliotheque-secrets -n bibliotheque \
#     --from-literal=DB_USER=biblio_user \
#     --from-literal=DB_PASSWORD='un-vrai-mot-de-passe' \
#     --from-literal=JWT_SECRET='une-longue-chaine-aleatoire'
#
# Ou bien : copier ce fichier en deploy/secret.yaml (ignoré par Git),
# remplacer les valeurs, puis : kubectl apply -f deploy/secret.yaml
#
# Attention : dans un Secret, les valeurs sont seulement encodées en base64,
# pas chiffrées. C'est pour ça qu'il ne faut jamais le pousser sur Git.
apiVersion: v1
kind: Secret
metadata:
  name: bibliotheque-secrets
  namespace: bibliotheque
type: Opaque
stringData:                # stringData : Kubernetes fait l'encodage base64 lui-même
  DB_USER: biblio_user
  DB_PASSWORD: CHANGE_ME
  JWT_SECRET: CHANGE_ME
