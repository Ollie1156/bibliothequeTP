# NodePort : le seul point d'entrée exposé hors du cluster.
# Accès le plus fiable sur Docker Desktop :
#   kubectl port-forward -n bibliotheque svc/front 8080:80   ->  http://localhost:8080
apiVersion: v1
kind: Service
metadata:
  name: front
spec:
  type: NodePort
  selector:
    app: front
  ports:
    - port: 80
      targetPort: 8080
      nodePort: 30080
