apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth
  labels:
    app: auth
spec:
  replicas: 2                  # 2 copies : si un pod tombe, l'autre répond
  strategy:
    type: RollingUpdate        # mise à jour progressive, sans interruption
    rollingUpdate:
      maxUnavailable: 0        # on ne retire jamais un pod avant que le nouveau soit prêt
      maxSurge: 1              # on ajoute au plus 1 pod en plus pendant la mise à jour
  selector:
    matchLabels:
      app: auth
  template:
    metadata:
      labels:
        app: auth
    spec:
      securityContext:
        runAsNonRoot: true     # refuse de lancer le conteneur s'il tourne en root
      containers:
        - name: auth
          image: ghcr.io/ollie1156/bibliotheque-auth   # le tag est fixé dans kustomization.yaml
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 4001
          envFrom:
            - configMapRef:
                name: app-config               # DB_HOST, DB_PORT, DB_NAME, CORS_ORIGINS
          env:
            - name: DB_USER
              valueFrom:
                secretKeyRef: { name: bibliotheque-secrets, key: DB_USER }
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef: { name: bibliotheque-secrets, key: DB_PASSWORD }
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef: { name: bibliotheque-secrets, key: JWT_SECRET }
          # readiness : le pod ne reçoit du trafic que lorsqu'il répond
          readinessProbe:
            httpGet: { path: /health, port: 4001 }
            initialDelaySeconds: 5
            periodSeconds: 5
          # liveness : si le service ne répond plus, Kubernetes redémarre le conteneur (auto-réparation)
          livenessProbe:
            httpGet: { path: /health, port: 4001 }
            initialDelaySeconds: 15
            periodSeconds: 10
          resources:
            requests: { cpu: 50m, memory: 96Mi }
            limits: { cpu: 500m, memory: 256Mi }
