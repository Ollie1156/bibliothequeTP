# Nginx sert la page web ET joue le rôle de reverse proxy vers les API.
# Avantage : le navigateur ne parle qu'à une seule adresse (pas de CORS,
# pas de ports d'API à exposer). Les noms "auth" et "books" sont résolus
# par le DNS de Docker Compose ou de Kubernetes (noms des Services).
server {
    # 8080 et pas 80 : l'image tourne sans les droits root
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location = /health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # /api/auth/users/login  ->  http://auth:4001/users/login
    location /api/auth/ {
        proxy_pass http://auth:4001/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # /api/books/books  ->  http://books:4002/books
    location /api/books/ {
        proxy_pass http://books:4002/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
